server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # env.js se regenera en cada arranque: nunca cachearlo
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # assets con hash de Vite: cache largo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /storage/ (firmas) -> backend Laravel. Lo genera entrypoint.sh a partir
    # de VITE_STORAGE_URL / VITE_AUTH_API_URL; vacío si no hay backend. Con comodín: si el archivo no
    # existe (entrypoint sin correr), nginx arranca igual, sin proxy.
    include /etc/nginx/storage-proxy*.conf;

    # SPA (react-router): cualquier ruta cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
