server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # env.js se regenera en cada arranque: nunca cachearlo
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # assets con hash de Vite: cache largo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA (react-router): cualquier ruta cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
