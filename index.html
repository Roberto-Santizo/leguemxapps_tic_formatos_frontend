<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-legumex-icon.png" />
    <!-- interactive-widget: en Android el teclado achica la ventana y lo fijo queda a la vista -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#f4f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e100e" media="(prefers-color-scheme: dark)" />
    <title>Legumex · Formatos TIC</title>
    <script src="/env.js"></script>
    <!-- Tema guardado (claro u oscuro) antes de pintar, para que no parpadee (src/utils/tema.js) -->
    <script>try{var t=localStorage.getItem('legumex_tema');if(t==='claro'||t==='oscuro')document.documentElement.setAttribute('data-tema',t)}catch(e){}</script>
    <!-- Fase del cielo por la hora de Guatemala (mismos cortes que FASES_CIELO en src/config/cielo.js) -->
    <script>try{var g=new Date(Date.now()+(new Date().getTimezoneOffset()-360)*6e4),m=g.getHours()*60+g.getMinutes();document.documentElement.setAttribute('data-fase',m<330?'noche':m<420?'amanecer':m<1035?'dia':m<1125?'atardecer':'noche')}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
